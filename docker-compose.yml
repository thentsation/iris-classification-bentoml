services:
  app:
    image: ${APP_IMAGE:-gru.ocir.io/grun5vjqis7z/iris-classification-bentoml:latest}
    pull_policy: missing
    container_name: iris-classification-bentoml
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.iris-classification-bentoml.rule=Host(`iris-bentoml.137-131-175-7.sslip.io`)
      - traefik.http.routers.iris-classification-bentoml.entrypoints=websecure
      - traefik.http.routers.iris-classification-bentoml.tls.certresolver=letsencrypt
      - traefik.http.services.iris-classification-bentoml.loadbalancer.server.port=3000

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
